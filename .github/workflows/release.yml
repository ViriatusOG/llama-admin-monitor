name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: llama-admin-monitor-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: llama-admin-monitor-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: llama-admin-monitor-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: llama-admin-monitor-macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # The binary learns its release track and tag at compile time; the
      # in-app updater compares against these (see src/update.rs).
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          LLAMA_ADMIN_RELEASE_TAG: ${{ github.ref_name }}
          LLAMA_ADMIN_TRACK: ${{ contains(github.ref_name, '-beta') && 'beta' || 'main' }}

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/llama-admin-monitor ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum llama-admin-monitor-* > SHA256SUMS
          cat SHA256SUMS

      # Tags containing "-beta" (e.g. v2026.9.21-beta.1) publish as
      # pre-releases, which is what the updater's beta track installs.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          files: |
            artifacts/llama-admin-monitor-*
            artifacts/SHA256SUMS
